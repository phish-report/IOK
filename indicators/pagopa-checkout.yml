title: PagoPA Checkout Phishing Kit
description: |
  Detects sites that mimic the payment process of the PagoPA platform established by the Italian Government for payments to public administrations using cleave JS library to validate credit card numbers
first_seen: 2025-04-14
references:
    - https://cert-agid.gov.it/wp-content/uploads/2025/04/pagoPA.json

detection:
  requestsContent:
    requests|contains:
      - 'cleave.min.js'
  phpSessionCookie:
    cookies|startswith: 'PHPSESSID='
  paymentString:
    dom|contains:
      - 'pagamento'
      - 'pagopa'

  condition: requestsContent and phpSessionCookie and paymentString

tags:
  - kit
  - target_country.italy
  - target.pagopa
